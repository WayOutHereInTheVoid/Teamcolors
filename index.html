  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      margin: -24px 0 0 -24px;
      border: 4px solid #1E293B; /* slate-800 */
      border-top-color: #06B6D4; /* cyan-500 */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .ios-slider {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      touch-action: none;
    }
    .ios-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 28px;
      width: 28px;
      border-radius: 50%;
      background: #06b6d4; /* cyan-500 */
      cursor: pointer;
      margin-top: -12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .ios-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #334155; /* slate-700 */
      border-radius: 2px;
    }
    .ios-slider-wrapper {
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.2s ease-out forwards;
    }
  </style>
</head>

      constructor(props) {
        super(props);

      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error", error, errorInfo);
      }

                <div>

                >
                  Reload Application
                </button>
              </div>
            </div>
          );
        }

      }

    // --- COLOR MATH HELPERS ---
    function hexToRgb(hex) {
      if (!hex) return { r: 0, g: 0, b: 0 };
      let cleanHex = hex.replace('#', '');
      if (cleanHex.length === 3) {
        cleanHex = cleanHex.split('').map(c => c + c).join('');
      }
      const num = parseInt(cleanHex, 16);
      if (isNaN(num)) return { r: 0, g: 0, b: 0 };
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function rgbToHex(r, g, b) {
      const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
      const toHex = (c) => {
        const h = clamp(c).toString(16);
        return h.length === 1 ? '0' + h : h;
      };
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
    }

    function rgbToHsb(r, g, b) {
      const rNorm = r / 255;
      const gNorm = g / 255;
      const bNorm = b / 255;

      const max = Math.max(rNorm, gNorm, bNorm);
      const min = Math.min(rNorm, gNorm, bNorm);
      const d = max - min;

      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const brightness = max;

      if (max !== min) {
        switch (max) {
          case rNorm:
            h = (gNorm - bNorm) / d + (gNorm < bNorm ? 6 : 0);
            break;
          case gNorm:
            h = (bNorm - rNorm) / d + 2;
            break;
          case bNorm:
            h = (rNorm - gNorm) / d + 4;
            break;
        }
        h /= 6;
      }

      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        b: Math.round(brightness * 100)
      };
    }

    function hsbToRgb(h, s, b) {
      const hNorm = ((h % 360 + 360) % 360) / 360;
      const sNorm = Math.max(0, Math.min(100, s)) / 100;
      const bNorm = Math.max(0, Math.min(100, b)) / 100;

      const i = Math.floor(hNorm * 6);
      const f = hNorm * 6 - i;
      const p = bNorm * (1 - sNorm);
      const q = bNorm * (1 - f * sNorm);
      const t = bNorm * (1 - (1 - f) * sNorm);

      let red = 0, green = 0, blue = 0;

      switch (i % 6) {
        case 0: red = bNorm; green = t; blue = p; break;
        case 1: red = q; green = bNorm; blue = p; break;
        case 2: red = p; green = bNorm; blue = t; break;
        case 3: red = p; green = q; blue = bNorm; break;
        case 4: red = t; green = p; blue = bNorm; break;
        case 5: red = bNorm; green = p; blue = q; break;
      }

      return {
        r: Math.round(red * 255),
        g: Math.round(green * 255),
        b: Math.round(blue * 255)
      };
    }

    function simulateFinish(hex, finish) {
      if (!hex) return {};

      const rgb = hexToRgb(hex);
      const hsb = rgbToHsb(rgb.r, rgb.g, rgb.b);

      if (finish === 'metallic') {
        const lightenedHsb = { ...hsb, b: Math.min(100, hsb.b + 15) };
        const darkenedHsb = { ...hsb, b: Math.max(0, hsb.b - 20) };

        const lightenedRgb = hsbToRgb(lightenedHsb.h, lightenedHsb.s, lightenedHsb.b);
        const darkenedRgb = hsbToRgb(darkenedHsb.h, darkenedHsb.s, darkenedHsb.b);

        const lightenedHex = rgbToHex(lightenedRgb.r, lightenedRgb.g, lightenedRgb.b);
        const darkenedHex = rgbToHex(darkenedRgb.r, darkenedRgb.g, darkenedRgb.b);

        return {
          background: `linear-gradient(135deg, ${lightenedHex} 0%, ${hex} 45%, ${darkenedHex} 100%)`,
          boxShadow: 'inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -2px 4px rgba(0, 0, 0, 0.3)'
        };
      }

      if (finish === 'matte') {
        const adjustedHsb = {
          ...hsb,
          s: Math.max(0, hsb.s - 8),
          b: Math.max(0, hsb.b - 5)
        };
        const adjustedRgb = hsbToRgb(adjustedHsb.h, adjustedHsb.s, adjustedHsb.b);
        const adjustedHex = rgbToHex(adjustedRgb.r, adjustedRgb.g, adjustedRgb.b);

        return {
          background: adjustedHex,
          filter: 'contrast(0.92) brightness(0.95)'
        };
      }

      // Default / flat
      return {
        background: hex
      };
    }

    function getRelativeLuminance({ r, g, b }) {
      const a = [r, g, b].map(v => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
    }


    function calculateColorDistance(hex1, hex2) {
      if (!hex1 || !hex2) return 100;
      const rgb1 = hexToRgb(hex1);
      const rgb2 = hexToRgb(hex2);
      if (!rgb1 || !rgb2) return 100;
      const hsb1 = rgbToHsb(rgb1.r, rgb1.g, rgb1.b);
      const hsb2 = rgbToHsb(rgb2.r, rgb2.g, rgb2.b);

      const hueDist = Math.min(Math.abs(hsb1.h - hsb2.h), 360 - Math.abs(hsb1.h - hsb2.h));
      const satDist = Math.abs(hsb1.s - hsb2.s);
      const brightDist = Math.abs(hsb1.b - hsb2.b);

      // weighted score: (hueDist / 180) * 60 + (satDist / 100) * 25 + (brightDist / 100) * 15
      const score = (hueDist / 180) * 60 + (satDist / 100) * 25 + (brightDist / 100) * 15;

      return Math.min(100, Math.max(0, score));
    }

    function getContrastRatio(hex1, hex2) {
      const rgb1 = hexToRgb(hex1);
      const rgb2 = hexToRgb(hex2);
      const lum1 = getRelativeLuminance(rgb1);
      const lum2 = getRelativeLuminance(rgb2);
      const brightest = Math.max(lum1, lum2);
      const darkest = Math.min(lum1, lum2);
      return (brightest + 0.05) / (darkest + 0.05);
    }




    function getTeamPrimaryColor(team) {
      if (!team || !team.colors || team.colors.length === 0) return null;
      const dominant = team.colors.find(c => c.role === 'dominant');
      if (dominant && dominant.hex) return dominant.hex;
      return team.colors[0].hex;
    }

    function getColorByRole(team, role, fallbackIndex) {
      if (!team || !team.colors) return null;
      const byRole = team.colors.find(c => c.role === role);
      if (byRole) return byRole;
      if (fallbackIndex >= 0 && fallbackIndex < team.colors.length) {
        return team.colors[fallbackIndex];
      }
      return team.colors[0]; // ultimate fallback
    }

    function calculateVibrationScore(colors) {
      const flagged = [];
      for (let i = 0; i < colors.length; i++) {
        for (let j = i + 1; j < colors.length; j++) {
          const c1 = colors[i];
          const c2 = colors[j];
          const rgb1 = hexToRgb(c1.hex);
          const rgb2 = hexToRgb(c2.hex);
          const hsb1 = rgbToHsb(rgb1.r, rgb1.g, rgb1.b);
          const hsb2 = rgbToHsb(rgb2.r, rgb2.g, rgb2.b);

          const hueDist = Math.min(Math.abs(hsb1.h - hsb2.h), 360 - Math.abs(hsb1.h - hsb2.h));
          if (hsb1.s > 70 && hsb2.s > 70 && hueDist < 60) {
            flagged.push({ c1, c2, hsb1, hsb2, hueDist });
          }
        }
      }

      let label = 'clean';
      if (flagged.length > 0) {
        label = flagged.length > 1 ? 'friction' : 'watch';
      }

      return { label, flagged, count: flagged.length };
    }

    function calculatePaletteHealthScore(team) {
      if (!team || !team.colors) return { total: 0, breakdown: { roles: 0, vibration: 0, contrast: 0, away: 0 } };

      // A. Role Completeness
      let rolesScore = 0;
      const rolesToFind = ['dominant', 'secondary', 'accent', 'neutral'];
      const foundRoles = new Set();
      team.colors.forEach(c => {
        if (c.role && rolesToFind.includes(c.role)) {
          foundRoles.add(c.role);
        }
      });
      rolesScore = foundRoles.size * 6.25;

      // B. Vibration Risk
      let vibrationScore = 0;
      const vibrationData = calculateVibrationScore(team.colors);
      if (vibrationData.count > 2) {
        vibrationScore = 0;
      } else if (vibrationData.label === 'clean') {
        vibrationScore = 25;
      } else if (vibrationData.label === 'watch') {
        vibrationScore = 15;
      } else if (vibrationData.label === 'friction') {
        vibrationScore = 5;
      }

      // C. Broadcast Contrast
      let contrastScore = 0;
      const dominant = getColorByRole(team, 'dominant', 0);
      const secondary = getColorByRole(team, 'secondary', 1);

      if (dominant && secondary) {
        const ratio = getContrastRatio(dominant.hex, secondary.hex);
        if (ratio >= 7.0) contrastScore = 25;
        else if (ratio >= 4.5) contrastScore = 18;
        else if (ratio >= 3.0) contrastScore = 10;
        else contrastScore = 0;
      }

      // D. Away Swap Viability
      let awayScore = 0;
      if (secondary) {
        const awayRatio = getContrastRatio(secondary.hex, '#FFFFFF');
        if (awayRatio >= 4.5) awayScore = 25;
        else if (awayRatio >= 3.0) awayScore = 15;
        else if (awayRatio >= 2.0) awayScore = 8;
        else awayScore = 0;
      }

      const total = rolesScore + vibrationScore + contrastScore + awayScore;

      return { total, breakdown: { roles: rolesScore, vibration: vibrationScore, contrast: contrastScore, away: awayScore } };
    }

    function getDesaturationSuggestions(flaggedPairs) {
      if (!flaggedPairs || flaggedPairs.length === 0) return [];

      return flaggedPairs.map(pair => {
        let candidateColor;
        let partnerColor;
        let targetHsb;

        if (pair.hsb1.s > pair.hsb2.s) {
          candidateColor = pair.c1;
          partnerColor = pair.c2;
          targetHsb = { ...pair.hsb1 };
        } else {
          candidateColor = pair.c2;
          partnerColor = pair.c1;
          targetHsb = { ...pair.hsb2 };
        }

        const originalSaturation = targetHsb.s;

        const reductionNeeded = targetHsb.s - 69;
        const reductionAmount = Math.min(20, reductionNeeded > 0 ? reductionNeeded : 0);

        targetHsb.s = Math.max(0, targetHsb.s - reductionAmount);

        const targetRgb = hsbToRgb(targetHsb.h, targetHsb.s, targetHsb.b);
        const suggestedHex = rgbToHex(targetRgb.r, targetRgb.g, targetRgb.b);

        return {
          originalColor: candidateColor,
          partnerColor: partnerColor,
          originalSaturation: Math.round(originalSaturation),
          targetSaturation: Math.round(targetHsb.s),
          suggestedHex: suggestedHex
        };
      });
    }

    function getHueGroup(hex) {
      const rgb = hexToRgb(hex);
      const { h, s, b } = rgbToHsb(rgb.r, rgb.g, rgb.b);

      if (s < 12 || b < 8 || (b > 93 && s < 15)) {
        return 'Neutrals & Greys';
      }
      if (h >= 345 || h < 15) return 'Reds & Maroons';
      if (h >= 15 && h < 45) return 'Oranges';
      if (h >= 45 && h < 70) return 'Yellows & Golds';
      if (h >= 70 && h < 165) return 'Greens';
      if (h >= 165 && h < 200) return 'Cyans & Aquas';
      if (h >= 200 && h < 260) return 'Blues';
      if (h >= 260 && h < 320) return 'Purples & Violets';
      if (h >= 320 && h < 345) return 'Pinks & Magentas';

      return 'Neutrals & Greys';
    }

    function getBestTextColor(bgHex) {
      const ratioWithWhite = getContrastRatio(bgHex, '#FFFFFF');
      const ratioWithBlack = getContrastRatio(bgHex, '#111827');
      return ratioWithWhite >= ratioWithBlack ? '#FFFFFF' : '#111827';
    }

    function blendColors(hex1, hex2) {
      const rgb1 = hexToRgb(hex1);
      const rgb2 = hexToRgb(hex2);
      return rgbToHex(
        Math.round((rgb1.r + rgb2.r) / 2),
        Math.round((rgb1.g + rgb2.g) / 2),
        Math.round((rgb1.b + rgb2.b) / 2)
      );
    }

    // --- CANVAS DRAWING HELPERS ---
    function drawRoundedRect(ctx, x, y, width, height, radius, fill = true, stroke = false, fillColor = '#000', strokeColor = '#333') {
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, width, height, radius);
      } else {
        const r = typeof radius === 'number' ? radius : radius[0] || 0;
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
      }
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fillColor;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRoundedSegment(ctx, x, y, width, height, fillHex, isLeft, isRight, radius = 8) {
      ctx.save();
      ctx.fillStyle = fillHex;
      ctx.beginPath();
      const rL = isLeft ? radius : 0;
      const rR = isRight ? radius : 0;
      if (ctx.roundRect) {
        ctx.roundRect(x, y, width, height, [rL, rR, rR, rL]);
      } else {
        ctx.rect(x, y, width, height);
      }
      ctx.fill();
      ctx.restore();
    }

    function parseImportJson(raw) {
      try {
        const parsed = JSON.parse(raw);
        const data = Array.isArray(parsed) ? parsed : [parsed];

        for (const item of data) {
          if (!item.id || !item.team || !Array.isArray(item.colors)) {
            return { error: 'Invalid format: each team must have id, team name, and colors array.' };
          }
          for (const c of item.colors) {
            if (!c.id || !c.name || !c.hex) {
              return { error: 'Invalid color format: each color must have id, name, and hex.' };
            }
          }
        }
        return { data };
      } catch (err) {
        return { error: 'Invalid JSON string.' };
      }
    }

    function applyImport(currentTeams, incoming) {
      const updated = [...currentTeams];
      incoming.forEach(incTeam => {
        const idx = updated.findIndex(t => t.id === incTeam.id);
        if (idx !== -1) {
          updated[idx] = incTeam;
        } else {
          updated.push(incTeam);
        }
      });
      return updated;
    }

    // --- MOOD CHART COMPONENT ---
    function ColorMoodChart({ colors, dominantHex }) {
      const data = useMemo(() => {
        if (!colors || colors.length === 0) return [0, 0, 0, 0, 0];

        // 1. Saturation
        let sumS = 0;
        let minB = 100, maxB = 0;
        const hues = [];
        let warmCount = 0;
        let chromaticCount = 0;

        colors.forEach(c => {
          const rgb = hexToRgb(c.hex);
          const hsb = rgbToHsb(rgb.r, rgb.g, rgb.b);

          sumS += hsb.s;
          if (hsb.b < minB) minB = hsb.b;
          if (hsb.b > maxB) maxB = hsb.b;

          hues.push(hsb.h);

          if (hsb.s >= 15) {
            chromaticCount++;
            if ((hsb.h >= 0 && hsb.h <= 60) || (hsb.h >= 300 && hsb.h <= 360)) {
              warmCount++;
            }
          }
        });

        const avgSat = Math.round(sumS / colors.length);

        // 2. Brightness Range
        const brightRange = maxB - minB;

        // 3. Hue Spread
        hues.sort((a, b) => a - b);
        let maxGap = 0;
        for (let i = 0; i < hues.length; i++) {
          const next = hues[(i + 1) % hues.length];
          let gap = next - hues[i];
          if (gap < 0) gap += 360;
          if (gap > maxGap) maxGap = gap;
        }
        const spread = 360 - maxGap;
        const hueScore = Math.min(100, Math.round((spread / 180) * 100));

        // 4. Contrast Range
        let minRatio = Infinity;
        let maxRatio = 0;
        for (let i = 0; i < colors.length; i++) {
          for (let j = i + 1; j < colors.length; j++) {
            const ratio = getContrastRatio(colors[i].hex, colors[j].hex);
            if (ratio < minRatio) minRatio = ratio;
            if (ratio > maxRatio) maxRatio = ratio;
          }
        }
        if (minRatio === Infinity) minRatio = 1;
        const ratioRange = maxRatio - minRatio;
        const contrastScore = Math.min(100, Math.round((ratioRange / 20) * 100));

        // 5. Warmth Ratio
        const warmthScore = chromaticCount === 0 ? 50 : Math.round((warmCount / chromaticCount) * 100);

        return [avgSat, brightRange, hueScore, contrastScore, warmthScore];
      }, [colors]);

      const cx = 130;
      const cy = 130;
      const r = 100;
      const angles = [
        -Math.PI / 2,
        -Math.PI / 2 + (2 * Math.PI) / 5,
        -Math.PI / 2 + (4 * Math.PI) / 5,
        -Math.PI / 2 + (6 * Math.PI) / 5,
        -Math.PI / 2 + (8 * Math.PI) / 5,
      ];

      const getPoint = (val, i) => {
        const dist = (val / 100) * r;
        return `${cx + dist * Math.cos(angles[i])},${cy + dist * Math.sin(angles[i])}`;
      };

      const labels = ["Saturation", "Brightness", "Hue Spread", "Contrast", "Warmth"];

      const getLabelPos = (i) => {
        const dist = r + 40; // Increased distance to prevent clipping
        return {
          x: cx + dist * Math.cos(angles[i]),
          y: cy + dist * Math.sin(angles[i])
        };
      };

      const polyPoints = data.map((val, i) => getPoint(val, i)).join(" ");
      const midPoints = [50, 50, 50, 50, 50].map((val, i) => getPoint(val, i)).join(" ");
      const maxPoints = [100, 100, 100, 100, 100].map((val, i) => getPoint(val, i)).join(" ");

      return (
        <div className="flex flex-col items-center">
          <svg width="260" height="260" viewBox="-80 -60 420 380" style={{ maxWidth: '100%', height: 'auto', overflow: 'visible' }}>
            {/* Guide Polygons */}
            <polygon points={maxPoints} fill="none" stroke="#334155" strokeWidth="1" opacity="0.5" />
            <polygon points={midPoints} fill="none" stroke="#475569" strokeDasharray="4 4" strokeWidth="1" opacity="0.5" />

            {/* Axes */}
            {angles.map((ang, i) => (
              <line key={`axis-${i}`} x1={cx} y1={cy} x2={cx + r * Math.cos(ang)} y2={cy + r * Math.sin(ang)} stroke="#334155" strokeWidth="1" opacity="0.5" />
            ))}

            {/* Data Polygon */}
            <polygon
              points={polyPoints}
              fill={dominantHex}
              fillOpacity="0.3"
              stroke={dominantHex}
              strokeWidth="2"
              strokeOpacity="0.8"
              strokeLinejoin="round"
            />

            {/* Vertices */}
            {data.map((val, i) => {
              const pt = getPoint(val, i).split(',');
              return (
                <circle key={`pt-${i}`} cx={pt[0]} cy={pt[1]} r="4" fill={dominantHex} stroke="#0f172a" strokeWidth="1.5" />
              );
            })}

            {/* Labels */}
            {labels.map((lbl, i) => {
              const pos = getLabelPos(i);
              let textAnchor = "middle";
              if (Math.cos(angles[i]) > 0.1) textAnchor = "start";
              if (Math.cos(angles[i]) < -0.1) textAnchor = "end";
              let yOffset = Math.sin(angles[i]) > 0.1 ? 10 : (Math.sin(angles[i]) < -0.1 ? -5 : 4);

              return (
                <g key={`lbl-${i}`}>
                  <text x={pos.x} y={pos.y + yOffset} fill="#94a3b8" fontSize="10" fontWeight="600" textAnchor={textAnchor} className="font-sans uppercase tracking-wider">{lbl}</text>
                  <text x={pos.x} y={pos.y + yOffset + 12} fill="#e2e8f0" fontSize="11" fontWeight="700" textAnchor={textAnchor} className="font-mono">{data[i]}</text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            textArea.remove();
          }
          setToastMessage(`Copied ${label}: ${text}`);
          setTimeout(() => setToastMessage(null), 2500);
        } catch (err) {
          setToastMessage(`Copied: ${text}`);
          setTimeout(() => setToastMessage(null), 2500);
        }
      }, []);

      // Move Color Card Position
      const handleMoveColor = useCallback((teamId, fromIdx, toIdx) => {
        setTeams(prevTeams =>
          prevTeams.map(t => {
            if (t.id !== teamId) return t;
            if (toIdx < 0 || toIdx >= t.colors.length) return t;
            const updatedColors = [...t.colors];
            const [movedItem] = updatedColors.splice(fromIdx, 1);
            updatedColors.splice(toIdx, 0, movedItem);
            return { ...t, colors: updatedColors };
          })
        );
      }, []);

      // Update Color in Team Palette
      const handleUpdateColor = (teamId, colorId, key, value) => {
        setTeams(prevTeams =>
          prevTeams.map(t => {
            if (t.id !== teamId) return t;
            return {
              ...t,
              colors: t.colors.map(c => {
                if (c.id !== colorId) return c;
                if (key === 'hex') {
                  let cleanHex = value.toUpperCase();
                  if (!cleanHex.startsWith('#')) cleanHex = '#' + cleanHex;
                  return { ...c, hex: cleanHex };
                }
                return { ...c, [key]: value };
              })
            };
          })
        );
      };

      // Reset Team Palette to Original
      const handleResetTeam = (teamId) => {
        const origTeam = INITIAL_LEAGUE_DATA.teams.find(t => t.id === teamId);
        if (!origTeam) return;
        setTeams(prevTeams =>
          prevTeams.map(t => (t.id === teamId ? JSON.parse(JSON.stringify(origTeam)) : t))
        );
        if (selectedTeamId === teamId) {
          setOriginalColorsJson(JSON.stringify(origTeam.colors));
        }
        setToastMessage(`Reset ${origTeam.team} to default TRL colors`);
        setTimeout(() => setToastMessage(null), 2500);
      };

      // Reset All Teams
      const handleResetAll = () => {
        setTeams(JSON.parse(JSON.stringify(INITIAL_LEAGUE_DATA.teams)));
        setToastMessage('Reset all team palettes to TRL defaults');
        setTimeout(() => setToastMessage(null), 2500);
      };

      // Add Custom Color to Team
      const handleAddColor = (teamId) => {
        setTeams(prevTeams =>
          prevTeams.map(t => {
            if (t.id !== teamId) return t;
            const newId = `${teamId}-custom-${Date.now()}`;
            return {
              ...t,
              colors: [
                ...t.colors,
                { id: newId, name: `Custom Color ${t.colors.length + 1}`, hex: '#3B82F6' }
              ]
            };
          })
        );
      };

      // Delete Color from Team
      const handleDeleteColor = (teamId, colorId) => {
        setTeams(prevTeams =>
          prevTeams.map(t => {
            if (t.id !== teamId) return t;
            if (t.colors.length <= 2) return t;
            return {
              ...t,
              colors: t.colors.filter(c => c.id !== colorId)
            };
          })
        );
      };

      // Filtered Teams for Grid
      const filteredTeams = useMemo(() => {
        if (!searchQuery.trim()) return teams;
        const q = searchQuery.toLowerCase();
        return teams.filter(team => {
          const matchTeamName = team.team.toLowerCase().includes(q);
          const matchColor = team.colors.some(
            c => c.name.toLowerCase().includes(q) || c.hex.toLowerCase().includes(q)
          );
          return matchTeamName || matchColor;
        });
      }, [teams, searchQuery]);

      // Flattened All Colors across League

      const teamVibrationScores = useMemo(() => {
        const scores = {};
        teams.forEach(t => {
          scores[t.id] = calculateVibrationScore(t.colors);
        });
        return scores;
      }, [teams]);

      const paletteHealthScores = useMemo(() => {
        const scores = {};
        teams.forEach(t => {
          scores[t.id] = calculatePaletteHealthScore(t);
        });
        return scores;
      }, [teams]);

      const allLeagueColors = useMemo(() => {
        const list = [];
        teams.forEach(t => {
          t.colors.forEach(c => {
            const rgb = hexToRgb(c.hex);
            const hsb = rgbToHsb(rgb.r, rgb.g, rgb.b);
            const group = getHueGroup(c.hex);
            list.push({
              ...c,
              teamId: t.id,
              teamName: t.team,
              rgb,
              hsb,
              group
            });
          });
        });
        return list;
      }, [teams]);

      // Spectrum Grouped & Filtered List
      const spectrumColors = useMemo(() => {
        let list = [...allLeagueColors];

        if (spectrumFrictionOnly) {
          const flaggedIds = new Set();
          Object.values(teamVibrationScores).forEach(vibe => {
            vibe.flagged.forEach(f => {
              flaggedIds.add(f.c1.id);
              flaggedIds.add(f.c2.id);
            });
          });
          list = list.filter(c => flaggedIds.has(c.id));
        }

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(
            c =>
              c.name.toLowerCase().includes(q) ||
              c.hex.toLowerCase().includes(q) ||
              c.teamName.toLowerCase().includes(q)
          );
        }

        if (spectrumGroupFilter !== 'ALL') {
          list = list.filter(c => c.group === spectrumGroupFilter);
        }

        if (spectrumTeamFilter !== 'ALL') {
          list = list.filter(c => c.teamId === spectrumTeamFilter);
        }

        list.sort((a, b) => {
          if (spectrumSortBy === 'hue') return a.hsb.h - b.hsb.h;
          if (spectrumSortBy === 'brightness') return b.hsb.b - a.hsb.b;
          if (spectrumSortBy === 'saturation') return b.hsb.s - a.hsb.s;
          if (spectrumSortBy === 'name') return a.name.localeCompare(b.name);
          return 0;
        });

        return list;
      }, [allLeagueColors, searchQuery, spectrumGroupFilter, spectrumTeamFilter, spectrumSortBy, spectrumFrictionOnly, teamVibrationScores]);

      const isDirty = useMemo(() => {
        if (!selectedTeam || !originalColorsJson) return false;
        return JSON.stringify(selectedTeam.colors) !== originalColorsJson;
      }, [selectedTeam, originalColorsJson]);

      // --- EXPORT TARGET TEAMS COMPUTED ---
      const exportTeams = useMemo(() => {
        if (exportTeamScope === 'all') {
          return teams;
        }
        if (exportTeamScope === 'single') {
          const found = teams.find(t => t.id === exportSingleTeamId);
          return found ? [found] : [];
        }
        if (exportTeamScope === 'custom') {
          return teams.filter(t => selectedCustomTeamIds.includes(t.id));
        }
        return teams;
      }, [teams, exportTeamScope, exportSingleTeamId, selectedCustomTeamIds]);

      // Quick launcher to export single team
      const handleOpenImageExportForTeam = (teamId) => {
        setExportTeamScope('single');
        setExportSingleTeamId(teamId);
        setActiveTab('export');
      };

      // --- CANVAS RENDERING ENGINE ---
      const renderExportCanvas = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const targetTeams = exportTeams;
        if (targetTeams.length === 0) {
          canvas.width = 800;
          canvas.height = 400;
          ctx.fillStyle = '#0F172A';
          ctx.fillRect(0, 0, 800, 400);
          ctx.fillStyle = '#94A3B8';
          ctx.font = '16px Inter, system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('No teams selected for image export', 400, 200);
          return;
        }

        // Theme Palette Configs
        let bgColor = '#090D16';
        let cardBg = '#0F172A';
        let cardBorder = '#1E293B';
        let textColor = '#F8FAFC';
        let textMuted = '#94A3B8';
        let accentColor = '#06B6D4';
        let badgeBg = 'rgba(6, 182, 212, 0.15)';
        let badgeText = '#22D3EE';

        if (exportTheme === 'light') {
          bgColor = '#F8FAFC';
          cardBg = '#FFFFFF';
          cardBorder = '#E2E8F0';
          textColor = '#0F172A';
          textMuted = '#64748B';
          accentColor = '#0284C7';
          badgeBg = '#E0F2FE';
          badgeText = '#0369A1';
        } else if (exportTheme === 'midnight') {
          bgColor = '#030712';
          cardBg = '#0B0F19';
          cardBorder = '#1F2937';
          textColor = '#F9FAFB';
          textMuted = '#6B7280';
          accentColor = '#38BDF8';
          badgeBg = 'rgba(56, 189, 248, 0.15)';
          badgeText = '#38BDF8';
        } else if (exportTheme === 'navy') {
          bgColor = '#0B1329';
          cardBg = '#111C3A';
          cardBorder = '#1E2E5C';
          textColor = '#FFFFFF';
          textMuted = '#8DA4D0';
          accentColor = '#38BDF8';
          badgeBg = 'rgba(56, 189, 248, 0.2)';
          badgeText = '#7DD3FC';
        }

        const dpr = exportScale;
        const padding = 48;
        const headerHeight = exportShowHeader ? 110 : 20;

        let cols = parseInt(exportCols, 10) || 2;
        if (exportLayout === 'stack') cols = 1;
        if (exportLayout === 'compact') cols = Math.min(cols, 3);

        const cardGap = 24;
        let cardWidth = 420;
        if (cols === 1) cardWidth = 680;
        if (cols === 3) cardWidth = 360;
        if (cols === 4) cardWidth = 320;

        const maxColorsInTeam = Math.max(...targetTeams.map(t => t.colors.length));
        let cardHeight = 220;
        if (exportLayout === 'compact') {
          cardHeight = 110;
        } else if (exportDetail === 'full') {
          cardHeight = 110 + (maxColorsInTeam * 36);
        } else if (exportDetail === 'standard') {
          cardHeight = 100 + (maxColorsInTeam * 28);
        } else {
          cardHeight = 150;
        }

        const numRows = Math.ceil(targetTeams.length / cols);
        const totalWidth = padding * 2 + cols * cardWidth + (cols - 1) * cardGap;
        const footerHeight = 50;
        const totalHeight = padding + headerHeight + numRows * cardHeight + (numRows - 1) * cardGap + footerHeight + padding;

        canvas.width = totalWidth * dpr;
        canvas.height = totalHeight * dpr;

        ctx.save();
        ctx.scale(dpr, dpr);

        // Canvas Background
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, totalWidth, totalHeight);

        // Header Block
        if (exportShowHeader) {
          ctx.fillStyle = accentColor;
          ctx.fillRect(padding, padding, 6, 54);

          ctx.fillStyle = textColor;
          ctx.font = 'bold 28px Inter, system-ui, sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(exportTitle || 'TRL Team Color Guidelines', padding + 20, padding);

          ctx.fillStyle = textMuted;
          ctx.font = '500 14px Inter, system-ui, sans-serif';
          ctx.fillText(
            exportSubtitle || `Official Color Systems • ${targetTeams.length} Team${targetTeams.length > 1 ? 's' : ''}`,
            padding + 20,
            padding + 36
          );

          const badgeTextStr = `TRL COLOR STUDIO`;
          ctx.font = 'bold 11px monospace';
          const badgeWidth = ctx.measureText(badgeTextStr).width + 24;
          const badgeX = totalWidth - padding - badgeWidth;
          drawRoundedRect(ctx, badgeX, padding + 10, badgeWidth, 28, 14, true, true, badgeBg, cardBorder);
          ctx.fillStyle = badgeText;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(badgeTextStr, badgeX + badgeWidth / 2, padding + 24);
        }

        // Render Team Cards
        targetTeams.forEach((team, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);

          const x = padding + col * (cardWidth + cardGap);
          const y = padding + headerHeight + row * (cardHeight + cardGap);

          // Card Card Box
          drawRoundedRect(ctx, x, y, cardWidth, cardHeight, 16, true, true, cardBg, cardBorder);

          // Team Title
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillStyle = textColor;
          ctx.font = 'bold 18px Inter, system-ui, sans-serif';

          let displayName = team.team;
          if (ctx.measureText(displayName).width > cardWidth - 100) {
            while (displayName.length > 3 && ctx.measureText(displayName + '...').width > cardWidth - 100) {
              displayName = displayName.slice(0, -1);
            }
            displayName += '...';
          }
          ctx.fillText(displayName, x + 20, y + 18);

          if (team.note) {
            ctx.font = '10px monospace';
            ctx.fillStyle = '#F59E0B';
            ctx.fillText('• PLACEHOLDER', x + 20 + ctx.measureText(displayName).width + 8, y + 22);
          }

          if (exportLayout === 'compact') {
            const stripY = y + 52;
            const stripH = 38;
            const stripW = cardWidth - 40;
            const swatchW = stripW / team.colors.length;

            team.colors.forEach((c, cIdx) => {
              const sx = x + 20 + cIdx * swatchW;
              const isFirst = cIdx === 0;
              const isLast = cIdx === team.colors.length - 1;
              drawRoundedSegment(ctx, sx, stripY, swatchW, stripH, c.hex, isFirst, isLast);

              ctx.fillStyle = getBestTextColor(c.hex);
              ctx.font = 'bold 11px monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(c.hex, sx + swatchW / 2, stripY + stripH / 2);
            });
          } else {
            // Combined Top Color Bar
            const stripY = y + 50;
            const stripH = 18;
            const stripW = cardWidth - 40;
            const swatchW = stripW / team.colors.length;

            team.colors.forEach((c, cIdx) => {
              const sx = x + 20 + cIdx * swatchW;
              const isFirst = cIdx === 0;
              const isLast = cIdx === team.colors.length - 1;
              drawRoundedSegment(ctx, sx, stripY, swatchW, stripH, c.hex, isFirst, isLast, 6);
            });

            if (exportDetail !== 'minimal') {
              const startY = y + 80;
              team.colors.forEach((c, cIdx) => {
                const cy = startY + cIdx * (exportDetail === 'full' ? 36 : 28);
                if (cy + 24 > y + cardHeight) return;

                const swatchSize = exportDetail === 'full' ? 22 : 18;
                drawRoundedRect(ctx, x + 20, cy, swatchSize, swatchSize, 6, true, true, c.hex, 'rgba(255,255,255,0.2)');

                ctx.fillStyle = textColor;
                ctx.font = '600 13px Inter, system-ui, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                let cName = c.name;
                if (ctx.measureText(cName).width > cardWidth / 2 - 30) {
                  cName = cName.slice(0, 14) + '...';
                }
                ctx.fillText(cName, x + 20 + swatchSize + 10, cy + swatchSize / 2);

                const rgb = hexToRgb(c.hex);
                ctx.font = '11px monospace';
                ctx.fillStyle = textMuted;
                ctx.textAlign = 'right';

                if (exportDetail === 'full') {
                  ctx.fillText(`${c.hex} • rgb(${rgb.r},${rgb.g},${rgb.b})`, x + cardWidth - 20, cy + swatchSize / 2);
                } else {
                  ctx.fillText(c.hex, x + cardWidth - 20, cy + swatchSize / 2);
                }
              });
            } else {
              const startY = y + 82;
              const swatchBoxW = (cardWidth - 40 - (team.colors.length - 1) * 8) / team.colors.length;
              team.colors.forEach((c, cIdx) => {
                const cx = x + 20 + cIdx * (swatchBoxW + 8);
                const ch = 44;
                drawRoundedRect(ctx, cx, startY, swatchBoxW, ch, 8, true, true, c.hex, 'rgba(255,255,255,0.15)');

                ctx.fillStyle = getBestTextColor(c.hex);
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(c.hex, cx + swatchBoxW / 2, startY + ch / 2);
              });
            }
          }
        });

        // Footer Text
        const footerY = totalHeight - padding - 10;
        ctx.fillStyle = textMuted;
        ctx.font = '11px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`Generated with TRL Color Studio • Official Color Guidelines`, totalWidth / 2, footerY);

        ctx.restore();
      }, [
        exportTeams,
        exportTheme,
        exportCols,
        exportLayout,
        exportDetail,
        exportShowHeader,
        exportScale,
        exportTitle,
        exportSubtitle
      ]);

      // Re-render Canvas when activeTab === 'export' or settings change
      useEffect(() => {
        if (activeTab === 'export') {
          const timer = setTimeout(() => {
            renderExportCanvas();
          }, 60);
          return () => clearTimeout(timer);
        }
      }, [activeTab, renderExportCanvas]);

      // Image Download Handler
      const handleDownloadImage = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const dataUrl = canvas.toDataURL('image/png');

        // iOS Safari does not support the `download` attribute on anchor tags —
        // it shows a prompt but never saves the file. Open in a new tab instead
        // so the user can long-press → Save to Photos / Save to Files.
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        if (isIOS) {
          const newTab = window.open();
          if (newTab) {
            newTab.document.body.style.margin = '0';
            newTab.document.body.style.background = '#090D16';
            newTab.document.body.innerHTML = `
              <div style="padding:16px;font-family:system-ui;color:#94A3B8;font-size:13px;text-align:center;padding-bottom:8px">
                Long-press the image &rarr; <strong style="color:#22D3EE">Save to Photos</strong> or <strong style="color:#22D3EE">Save to Files</strong>
              </div>
              <img src="${dataUrl}" style="max-width:100%;display:block;border-radius:8px" />
            `;
          }
          setToastMessage('Image opened — long-press to save on iOS');
        } else {
          let filename = 'trl-color-palettes.png';
          if (exportTeamScope === 'single' && exportSingleTeamId) {
            const t = teams.find(team => team.id === exportSingleTeamId);
            if (t) {
              filename = `${t.team.toLowerCase().replace(/[^a-z0-9]/g, '-')}-palette.png`;
            }
          }
          const link = document.createElement('a');
          link.download = filename;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setToastMessage(`Downloaded PNG: ${filename}`);
        }

        setTimeout(() => setToastMessage(null), 3500);
      };

      // Copy Image to Clipboard
      const handleCopyImageToClipboard = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        // ClipboardItem image API is not supported on iOS Safari —
        // redirect to the download flow so the user still gets the image.
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          handleDownloadImage();
          return;
        }

        try {
          canvas.toBlob(async (blob) => {
            if (!blob) return;
            if (navigator.clipboard && window.ClipboardItem) {
              await navigator.clipboard.write([
                new ClipboardItem({ 'image/png': blob })
              ]);
              setToastMessage('Copied Palette Image to Clipboard!');
              setTimeout(() => setToastMessage(null), 3000);
            } else {
              setToastMessage('Browser does not support direct image copying. Download PNG instead.');
              setTimeout(() => setToastMessage(null), 3500);
            }
          }, 'image/png');
        } catch (err) {
          setToastMessage('Download PNG to export image');
          setTimeout(() => setToastMessage(null), 3000);
        }
      };

    const { matrixTeams, conflictPairs, seenPairs, distances } = useMemo(() => {
      const mappedTeams = [...teams].map(t => ({
        ...t,
        primaryHex: getTeamPrimaryColor(t)
      }));

      if (matrixSortOrder === 'alphabetical') {
        mappedTeams.sort((a, b) => (a.team || "").localeCompare(b.team || ""));
      } else if (matrixSortOrder === 'hue') {
        mappedTeams.sort((a, b) => {
          const hsbA = rgbToHsb(...Object.values(hexToRgb(a.primaryHex)));
          const hsbB = rgbToHsb(...Object.values(hexToRgb(b.primaryHex)));
          return hsbA.h - hsbB.h;
        });
      }

      const dists = {};
      const pairs = [];
      const seen = new Set();

      for (let i = 0; i < mappedTeams.length; i++) {
        for (let j = 0; j < mappedTeams.length; j++) {
          if (i === j) continue;
          const tA = mappedTeams[i];
          const tB = mappedTeams[j];
          const key1 = `${tA.id}-${tB.id}`;
          const key2 = `${tB.id}-${tA.id}`;

          if (!dists[key1]) {
            const dist = calculateColorDistance(tA.primaryHex, tB.primaryHex);
            dists[key1] = dist;
            dists[key2] = dist;

            if (i < j && dist < 20 && !seen.has(key1) && !seen.has(key2)) {
              pairs.push({ tA, tB, dist });
              seen.add(key1);
              seen.add(key2);
            }
          }
        }
      }
      pairs.sort((a, b) => a.dist - b.dist);

      return { matrixTeams: mappedTeams, conflictPairs: pairs, seenPairs: seen, distances: dists };
    }, [teams, matrixSortOrder]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-slate-950">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed z-50 flex items-center gap-3 bg-cyan-500 text-slate-950 px-4 py-3 rounded-xl shadow-2xl font-semibold border border-cyan-300 animate-fade-in-up" style={{ bottom: 'calc(1.5rem + env(safe-area-inset-bottom, 0px))', right: '1.5rem' }}>
              <CheckCircle2 className="w-5 h-5 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Header Bar */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3 w-full md:w-auto justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-md shadow-cyan-500/20">
                    <Palette className="w-6 h-6 text-slate-950" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-xl font-bold tracking-tight text-white">TRL Color Studio</h1>
                      <span className="bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-xs px-2 py-0.5 rounded-full font-mono">
                        A–Z Teams
                      </span>
                    </div>
                    <p className="text-xs text-slate-400">The Real League Color Systems & Format Converter</p>
                  </div>
                </div>

                <button
                  onClick={handleResetAll}
                  className="min-h-[44px] md:hidden p-2 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition"
                  title="Reset All Palettes"
                >
                  <RotateCcw className="w-4 h-4" />
                </button>
              </div>

              {/* Navigation Tabs */}
              <div className="relative w-full md:w-auto">
                <div
                  className="pointer-events-none absolute right-0 top-0 bottom-0 w-10 z-10 rounded-r-xl md:hidden"
                  style={{ background: 'linear-gradient(to right, transparent, rgba(2,6,23,0.85))' }}
                />
                <div className="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 w-full md:w-auto overflow-x-auto whitespace-nowrap">
                <button
                  onClick={() => { setActiveTab('teams'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}

                          <label className="text-xs font-bold text-cyan-400 uppercase tracking-wider block">
                            1. Export Scope
                          </label>

                          <div className="grid grid-cols-3 gap-2">
                            <button
                              onClick={() => setExportTeamScope('all')}
                              className={`py-2 px-2 text-xs font-semibold rounded-xl border transition ${
                                exportTeamScope === 'all'
                                  ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300'
                                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                              }`}
                            >
                              All Teams ({teams.length})
                            </button>
                            <button
                              onClick={() => setExportTeamScope('single')}
                              className={`min-h-[44px] py-2 px-2 text-xs font-semibold rounded-xl border transition ${
                                exportTeamScope === 'single'
                                  ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300'
                                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                              }`}
                            >
                              Single Team
                            </button>
                            <button
                              onClick={() => setExportTeamScope('custom')}
                              className={`min-h-[44px] py-2 px-2 text-xs font-semibold rounded-xl border transition ${
                                exportTeamScope === 'custom'
                                  ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300'
                                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                              }`}
                            >
                              Multi-Select
                            </button>
                          </div>

                          {/* Single Team Dropdown */}
                          {exportTeamScope === 'single' && (
                            <div className="pt-2">
                              <select
                                value={exportSingleTeamId}
                                onChange={e => setExportSingleTeamId(e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-cyan-500"
                              >
                                {teams.map(t => (
                                  <option key={t.id} value={t.id}>
                                    {t.team} ({t.colors.length} colors)
                                  </option>
                                ))}
                              </select>
                            </div>
                          )}

                          {/* Custom Multi-Select Grid */}
                          {exportTeamScope === 'custom' && (
                            <div className="space-y-2 pt-2">
                              <div className="flex items-center justify-between text-[11px] text-slate-400 mb-1">
                                <span>Selected: {selectedCustomTeamIds.length} / {teams.length}</span>
                                <div className="flex gap-2">
                                  <button
                                    onClick={() => setSelectedCustomTeamIds(teams.map(t => t.id))}
                                    className="text-cyan-400 hover:underline"
                                  >
                                    Select All
                                  </button>
                                  <span>•</span>
                                  <button
                                    onClick={() => setSelectedCustomTeamIds([])}
                                    className="text-cyan-400 hover:underline"
                                  >
                                    Clear
                                  </button>
                                </div>
                              </div>

                              <div className="max-h-48 overflow-y-auto space-y-1 pr-1 bg-slate-900/80 p-2 rounded-xl border border-slate-800">
                                {teams.map(t => {
                                  const isChecked = selectedCustomTeamIds.includes(t.id);
                                  return (
                                    <label
                                      key={t.id}
                                      onClick={() => {
                                        if (isChecked) {
                                          setSelectedCustomTeamIds(selectedCustomTeamIds.filter(id => id !== t.id));
                                        } else {
                                          setSelectedCustomTeamIds([...selectedCustomTeamIds, t.id]);
                                        }
                                      }}
                                      className="flex items-center justify-between p-1.5 rounded-lg hover:bg-slate-800 cursor-pointer text-xs transition"
                                    >
                                      <span className={isChecked ? 'text-white font-medium' : 'text-slate-400'}>
                                        {t.team}
                                      </span>
                                      {isChecked ? (
                                        <CheckSquare className="w-4 h-4 text-cyan-400 shrink-0" />
                                      ) : (
                                        <Square className="w-4 h-4 text-slate-600 shrink-0" />
                                      )}
                                    </label>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                        </div>

                        {/* Layout & Style Customizer */}
                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-4">
                          <label className="text-xs font-bold text-cyan-400 uppercase tracking-wider block">
                            2. Styling & Layout Controls
                          </label>

                          <div className="grid grid-cols-2 gap-3 text-xs">
                            <div>
                              <span className="text-slate-400 block mb-1">Layout Preset:</span>
                              <select
                                value={exportLayout}
                                onChange={e => setExportLayout(e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:border-cyan-500"
                              >
                                <option value="grid">Grid Poster</option>
                                <option value="stack">Detailed Stack</option>
                                <option value="compact">Compact Stripes</option>
                              </select>
                            </div>

                            <div>
                              <span className="text-slate-400 block mb-1">Columns:</span>
                              <select
                                value={exportCols}
                                onChange={e => setExportCols(parseInt(e.target.value, 10))}
                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:border-cyan-500"
                              >
                                <option value={1}>1 Column</option>
                                <option value={2}>2 Columns</option>
                                <option value={3}>3 Columns</option>
                                <option value={4}>4 Columns</option>
                              </select>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-3 text-xs">
                            <div>
                              <span className="text-slate-400 block mb-1">Theme Color:</span>
                              <select
                                value={exportTheme}
                                onChange={e => setExportTheme(e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:border-cyan-500"
                              >
                                <option value="dark">Dark Slate</option>
                                <option value="light">Pure Light</option>
                                <option value="midnight">Midnight Black</option>
                                <option value="navy">Deep Navy</option>
                              </select>
                            </div>

                            <div>
                              <span className="text-slate-400 block mb-1">Swatch Details:</span>
                              <select
                                value={exportDetail}
                                onChange={e => setExportDetail(e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:border-cyan-500"
                              >
                                <option value="full">Full (Name + Hex + RGB)</option>
                                <option value="standard">Standard (Name + Hex)</option>
                                <option value="minimal">Minimal (Swatches + Hex)</option>
                              </select>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-3 text-xs pt-1">
                            <div>
                              <span className="text-slate-400 block mb-1">Resolution Scale:</span>
                              <select
                                value={exportScale}
                                onChange={e => setExportScale(parseInt(e.target.value, 10))}
                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:border-cyan-500"
                              >
                                <option value={1}>1x Standard</option>
                                <option value={2}>2x HD Crisp</option>
                                <option value={3}>3x Ultra HD</option>
                              </select>
                            </div>

                            <div className="flex flex-col justify-end">
                              <label className="flex items-center gap-2 cursor-pointer p-2 bg-slate-900 rounded-xl border border-slate-800 text-slate-300">
                                <input
                                  type="checkbox"
                                  checked={exportShowHeader}
                                  onChange={e => setExportShowHeader(e.target.checked)}
                                  className="accent-cyan-400"
                                />
                                <span>Include Header</span>
                              </label>
                            </div>
                          </div>

                          {/* Title & Subtitle Customizer */}
                          {exportShowHeader && (
                            <div className="space-y-2 pt-2 border-t border-slate-800">
                              <div>
                                <span className="text-[11px] text-slate-400 block mb-1">Graphic Header Title:</span>
                                <input
                                  type="text"
                                  value={exportTitle}
                                  onChange={e => setExportTitle(e.target.value)}
                                  className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white focus:border-cyan-500"
                                />
                              </div>
                              <div>
                                <span className="text-[11px] text-slate-400 block mb-1">Graphic Subtitle:</span>
                                <input
                                  type="text"
                                  value={exportSubtitle}
                                  onChange={e => setExportSubtitle(e.target.value)}
                                  className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white focus:border-cyan-500"
                                />
                              </div>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Right Live Canvas Preview */}
                      <div className="lg:col-span-7 flex flex-col justify-between space-y-4">
                        <div className="flex items-center justify-between text-xs text-slate-400">
                          <span className="font-semibold text-slate-300 uppercase tracking-wider">
                            Live Graphic Output Preview
                          </span>
                          <span className="font-mono text-[11px] bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">
                            Rendering {exportTeams.length} Team{exportTeams.length !== 1 ? 's' : ''} @ {exportScale}x Scale
                          </span>
                        </div>

                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col items-center justify-center min-h-[420px] max-h-[620px] overflow-auto relative shadow-2xl">
                          <canvas
                            ref={canvasRef}
                            className="max-w-full h-auto block rounded-xl shadow-2xl border border-slate-800/80 transition-all"
                            style={{ maxHeight: '560px', objectFit: 'contain' }}
                          />
                        </div>

                        <div className="flex items-center justify-between gap-4 pt-2">
                          <p className="text-xs text-slate-500">
                            Clicking download generates a pixel-perfect PNG image ready for media guides and presentations.
                          </p>

                          <button
                            onClick={handleDownloadImage}
                            className="min-h-[44px] shrink-0 flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-xs shadow-lg shadow-cyan-500/20 transition"
                          >
                            <Download className="w-4 h-4" />
                            <span>Save PNG Palette Sheet</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="pt-8 border-t border-slate-800 mt-8">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2 mb-2">
                        <Download className="w-5 h-5 text-cyan-400" />
                        League Palette Code Exporter
                      </h2>
                      <p className="text-xs text-slate-400 mb-6">
                        Export TRL color systems into CSS variables, Tailwind config snippets, SCSS, or JSON.
                      </p>
                    </div>

                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-semibold text-slate-300">CSS Custom Properties (--variables)</span>
                        <button
                          onClick={() => {
                            const cssCode = teams
                              .map(
                                t =>
                                  `/* ${t.team} */\n` +
                                  t.colors
                                    .map(
                                      c =>
                                        `--trl-${t.id}-${c.name
                                          .toLowerCase()
                                          .replace(/[^a-z0-9]/g, '-')}: ${c.hex};`
                                    )
                                    .join('\n')
                              )
                              .join('\n\n');
                            handleCopy(cssCode, 'CSS Variables');
                          }}
                          className="flex items-center gap-1.5 text-xs text-cyan-400 hover:text-cyan-300 bg-cyan-500/10 px-3 py-1 rounded-lg border border-cyan-500/20"
                        >
                          <Copy className="w-3.5 h-3.5" />
                          Copy CSS Code
                        </button>
                      </div>

                      <pre className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-xs font-mono text-cyan-300 overflow-x-auto max-h-48 scrollbar-thin">
                        {teams
                          .map(
                            t =>
                              `/* ${t.team} */\n` +
                              t.colors
                                .map(
                                  c =>
                                    `--trl-${t.id}-${c.name
                                      .toLowerCase()
                                      .replace(/[^a-z0-9]/g, '-')}: ${c.hex};`
                                )
                                .join('\n')
                          )
                          .join('\n\n')}
                      </pre>
                    </div>

                    <div className="space-y-2 pt-4 border-t border-slate-800">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-semibold text-slate-300">Tailwind CSS Color Config Object</span>
                        <button
                          onClick={() => {
                            const twObj = {};
                            teams.forEach(t => {
                              twObj[t.id] = {};
                              t.colors.forEach(c => {
                                const key = c.name.toLowerCase().replace(/[^a-z0-9]/g, '-');
                                twObj[t.id][key] = c.hex;
                              });
                            });
                            handleCopy(JSON.stringify({ theme: { extend: { colors: twObj } } }, null, 2), 'Tailwind Config');
                          }}
                          className="flex items-center gap-1.5 text-xs text-cyan-400 hover:text-cyan-300 bg-cyan-500/10 px-3 py-1 rounded-lg border border-cyan-500/20"
                        >
                          <Copy className="w-3.5 h-3.5" />
                          Copy Tailwind Config
                        </button>
                      </div>

                      <pre className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-xs font-mono text-cyan-300 overflow-x-auto max-h-48 scrollbar-thin">
                        {JSON.stringify(
                          {
                            theme: {
                              extend: {
                                colors: teams.reduce((acc, t) => {
                                  acc[t.id] = t.colors.reduce((cAcc, c) => {
                                    cAcc[c.name.toLowerCase().replace(/[^a-z0-9]/g, '-')] = c.hex;
                                    return cAcc;
                                  }, {});
                                  return acc;
                                }, {})
                              }
                            }
                          },
                          null,
                          2
                        )}
                      </pre>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Render App Component to DOM Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
